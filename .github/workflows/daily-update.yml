name: 朝の情報を自動更新

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 天気を取得
        run: python scripts/fetch_weather.py

      - name: ニュースを取得
        run: python scripts/fetch_news.py

      - name: 今日の予定を計算
        run: python scripts/generate_today_schedule.py

      - name: コーデ提案を生成
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}  # ← これを追加
        run: python scripts/generate_outfit.py

      - name: 更新内容をコミット
        run: |
          git config user.name "morning-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "chore: 朝の情報を自動更新"
          git push