name: 持ち服を削除

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  remove-items:
    if: contains(github.event.issue.labels.*.name, 'wardrobe-remove')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: アイテムを削除
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/remove_wardrobe_item.py

      - name: 変更をコミット
        run: |
          git config user.name "morning-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/wardrobe.json
          git diff --cached --quiet || git commit -m "chore: 持ち服を削除 (#${{ github.event.issue.number }})"
          git push

      - name: Issueにコメントしてクローズ
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "削除しました。"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });