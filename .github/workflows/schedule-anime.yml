name: アニメスケジュールを一括登録

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  add-anime:
    if: contains(github.event.issue.labels.*.name, 'schedule-anime')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: アニメスケジュールを登録
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_anime_bulk.py

      - name: 今日の予定を再計算
        run: python scripts/generate_today_schedule.py

      - name: 変更をコミット
        run: |
          git config user.name "morning-dashboard-bot"
          git config user.email "actions@github.com"
          git add data/anime_schedule.json data/today.json
          git diff --cached --quiet || git commit -m "chore: アニメスケジュールを登録 (#${{ github.event.issue.number }})"
          git push

      - name: Issueにコメントしてクローズ
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "登録しました。該当する曜日になると自動で「今日の予定」に表示されます。"
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });